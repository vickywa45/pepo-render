name: render
# Dipicu Pepo (tombol "Render MP4", khusus pemilik) lewat workflow_dispatch. Hanya akun dengan akses tulis ke repo ini
# yang bisa memicunya, jadi kuota tidak bisa dipakai orang lain walau repo publik.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: ID tugas render dari Pepo
        required: true
permissions:
  contents: read
concurrency:
  group: render-${{ github.event.inputs.job_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang perender
        run: |
          npm install --no-audit --no-fund --loglevel=error
          npx playwright install --with-deps chromium > /dev/null
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq ffmpeg fonts-noto-core > /dev/null
      - name: Render
        run: node render.js
        env:
          PEPO_API: ${{ secrets.PEPO_API }}
          PEPO_RENDER_TOKEN: ${{ secrets.PEPO_RENDER_TOKEN }}
          JOB_ID: ${{ github.event.inputs.job_id }}
